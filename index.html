<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Reihentrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Figtree:wght@500;700;800;900&family=Lexend:wght@400;500;700;800&family=Rubik:wght@500;700;800&family=Russo+One&family=Sora:wght@600;700;800&family=Barlow+Condensed:ital,wght@0,700;1,800;1,900&family=Baloo+2:wght@700;800&display=swap">
<style>
  /* ---------- Stile: Level (arcade), Klar (klar), Comic (comic) ---------- */
  body[data-look="klar"] {
    --bg: #f4f6fa;
    --text: #16264a; --text-dim: #6a7591;
    --surface: #ffffff; --ink: #16264a; --muted: #6a7591;
    --accent: #ff6a13; --accent-ink: #fff; --accent-shadow: 0 5px 0 #c94d05;
    --alt: #16264a; --alt-shadow: 0 5px 0 #0a1530;
    --op: #ff6a13; --ans: #16264a; --ans-line: #e3e8f2;
    --good: #16a864; --good-shadow: 0 4px 0 #0e7a47;
    --bad: #e5484d;  --bad-shadow: 0 4px 0 #a52a2e;
    --key: #ffffff; --key-ink: #16264a; --key-border: 2px solid #e3e8f2;
    --key-shadow: 0 4px 0 #e3e8f2; --key-shadow-press: 0 1px 0 #e3e8f2; --key-press: translateY(3px);
    --card-border: none; --card-shadow: 0 1px 2px rgba(22,38,74,.08), 0 10px 28px rgba(22,38,74,.08);
    --r-card: 22px; --r-btn: 14px;
    --prog-empty: #e3e8f2; --prog-half: #ffc49e; --prog-full: #ff6a13;
    --font-display: "Figtree", "Segoe UI", system-ui, sans-serif; --display-weight: 900;
    --font-num: var(--font-display); --num-weight: var(--display-weight);
    --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  body[data-look="arcade"] {
    --bg: radial-gradient(120% 70% at 50% 0%, #232c85 0%, #12163a 65%) fixed, #12163a;
    --text: #eef0ff; --text-dim: #8f96d6;
    --surface: #1c2254; --ink: #eef0ff; --muted: #8f96d6;
    --accent: #3ee0ff; --accent-ink: #0d1030; --accent-shadow: 0 5px 0 #1a9bb5;
    --alt: #ff4f8b; --alt-shadow: 0 5px 0 #a8264f;
    --op: #ff4f8b; --ans: #ffb627; --ans-line: #2c3478;
    --good: #1fbf75; --good-shadow: 0 5px 0 #0f7a49, 0 0 18px rgba(31,191,117,.55);
    --bad: #ff4f8b;  --bad-shadow: 0 5px 0 #a8264f;
    --key: #262e6e; --key-ink: #eef0ff; --key-border: none;
    --key-shadow: 0 5px 0 #0b0e2a; --key-shadow-press: 0 1px 0 #0b0e2a; --key-press: translateY(4px);
    --card-border: 2px solid #2c3478; --card-shadow: 0 0 40px rgba(62,224,255,.08);
    --r-card: 16px; --r-btn: 12px;
    --prog-empty: #2c3478; --prog-half: linear-gradient(90deg, #3ee0ff 50%, #2c3478 50%); --prog-full: #3ee0ff;
    --font-display: "Russo One", "Arial Black", sans-serif; --display-weight: 400;
    --font-num: var(--font-display); --num-weight: var(--display-weight);
    --font-body: "Rubik", "Segoe UI", system-ui, sans-serif;
  }
  body[data-look="comic"] {
    --bg: radial-gradient(rgba(20,20,20,.13) 1.3px, transparent 1.5px) 0 0 / 10px 10px, #ffd23f;
    --text: #141414; --text-dim: #141414;
    --surface: #fffdf4; --ink: #141414; --muted: #3a3a3a;
    --accent: #2b59c3; --accent-ink: #fff; --accent-shadow: 4px 4px 0 #141414;
    --alt: #e63946; --alt-shadow: 4px 4px 0 #141414;
    --op: #e63946; --ans: #2b59c3; --ans-line: #141414;
    --good: #2bb673; --good-shadow: 4px 4px 0 #141414;
    --bad: #e63946;  --bad-shadow: 4px 4px 0 #141414;
    --key: #ffffff; --key-ink: #141414; --key-border: 3px solid #141414;
    --key-shadow: 4px 4px 0 #141414; --key-shadow-press: 1px 1px 0 #141414; --key-press: translate(3px, 3px);
    --card-border: 3px solid #141414; --card-shadow: 7px 7px 0 #141414;
    --r-card: 6px; --r-btn: 6px;
    --prog-empty: rgba(20,20,20,.22); --prog-half: #fffdf4; --prog-full: #e63946;
    --font-display: "Bangers", "Impact", sans-serif; --display-weight: 400;
    /* Bangers-Ziffern sind schwer lesbar (7 sieht aus wie 1) – Zahlen daher in Lexend */
    --font-num: "Lexend", "Segoe UI", system-ui, sans-serif; --num-weight: 800;
    --font-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  }

  body[data-look="glas"] {
    --bg: radial-gradient(40% 35% at 12% 10%, #8fe3dc 0%, transparent 70%) fixed,
          radial-gradient(45% 40% at 92% 28%, #ffc2cf 0%, transparent 70%) fixed,
          radial-gradient(55% 45% at 40% 98%, #bcd7ff 0%, transparent 70%) fixed, #eef1f8;
    --text: #1c2340; --text-dim: #55607f;
    --surface: rgba(255,255,255,.55); --ink: #1c2340; --muted: #55607f;
    --accent: #0e9f9a; --accent-ink: #fff; --accent-shadow: 0 8px 20px rgba(14,159,154,.35);
    --alt: #f25c78; --alt-shadow: 0 8px 20px rgba(242,92,120,.3);
    --op: #f25c78; --ans: #0e9f9a; --ans-line: transparent;
    --good: #0e9f9a; --good-shadow: 0 6px 18px rgba(14,159,154,.4);
    --bad: #f25c78;  --bad-shadow: 0 6px 18px rgba(242,92,120,.35);
    --key: rgba(255,255,255,.72); --key-ink: #1c2340; --key-border: 1px solid rgba(255,255,255,.9);
    --key-shadow: 0 4px 14px rgba(28,35,64,.08); --key-shadow-press: 0 1px 4px rgba(28,35,64,.08); --key-press: translateY(2px);
    --card-border: 1px solid rgba(255,255,255,.85); --card-shadow: 0 10px 30px rgba(28,35,64,.08);
    --r-card: 24px; --r-btn: 18px;
    --prog-empty: rgba(28,35,64,.1); --prog-half: rgba(14,159,154,.45); --prog-full: #0e9f9a;
    --font-display: "Sora", "Segoe UI", system-ui, sans-serif; --display-weight: 800;
    --font-num: var(--font-display); --num-weight: var(--display-weight);
    --font-body: "Sora", "Segoe UI", system-ui, sans-serif;
    --trophy-ink: #fff;
  }
  body[data-look="sport"] {
    --bg: repeating-linear-gradient(115deg, transparent 0 38px, rgba(255,255,255,.06) 38px 76px) fixed,
          linear-gradient(160deg, #1d52ff 0%, #1340d8 55%, #0c2c9e 100%) fixed;
    --text: #fff; --text-dim: rgba(255,255,255,.82);
    --surface: #fff; --ink: #0a1440; --muted: #1340d8;
    --accent: #ffd400; --accent-ink: #0a1440; --accent-shadow: 5px 5px 0 #0a1440;
    --alt: #ff5a4e; --alt-shadow: 5px 5px 0 #0a1440;
    --op: #ff5a4e; --ans: #1340d8; --ans-line: #ffd400;
    --good: #16c47f; --good-shadow: 5px 5px 0 #0a1440;
    --bad: #ff5a4e;  --bad-shadow: 5px 5px 0 #0a1440;
    --key: #1340d8; --key-ink: #fff; --key-border: none;
    --key-shadow: 5px 5px 0 #0a1440; --key-shadow-press: 2px 2px 0 #0a1440; --key-press: translate(3px, 3px);
    --card-border: none; --card-shadow: 8px 8px 0 #0a1440;
    --r-card: 4px; --r-btn: 3px;
    --prog-empty: rgba(255,255,255,.2); --prog-half: linear-gradient(90deg, #ffd400 50%, rgba(255,255,255,.2) 50%); --prog-full: #ffd400;
    --font-display: "Barlow Condensed", "Arial Narrow", sans-serif; --display-weight: 900; --display-style: italic;
    --font-num: var(--font-display); --num-weight: var(--display-weight);
    --font-body: "Barlow Condensed", "Arial Narrow", sans-serif;
    --trophy-ink: #0a1440;
  }
  body[data-look="knete"] {
    --puff: inset -5px -6px 10px rgba(61,44,78,.10), inset 5px 6px 10px rgba(255,255,255,.75), 6px 9px 18px rgba(170,100,80,.22);
    --puff-in: inset 5px 6px 10px rgba(61,44,78,.14), inset -4px -4px 8px rgba(255,255,255,.6), 2px 3px 6px rgba(170,100,80,.18);
    --bg: #ffe9dc;
    --text: #3d2c4e; --text-dim: #8a6f7e;
    --surface: #fff4ec; --ink: #3d2c4e; --muted: #8a6f7e;
    --accent: #7b5cff; --accent-ink: #fff; --accent-shadow: var(--puff);
    --alt: #ff8a5c; --alt-shadow: var(--puff);
    --op: #ff8a5c; --ans: #7b5cff; --ans-line: transparent;
    --good: #43c78b; --good-shadow: var(--puff);
    --bad: #ff7b7b;  --bad-shadow: var(--puff);
    --key: #fff9f4; --key-ink: #3d2c4e; --key-border: none;
    --key-shadow: var(--puff); --key-shadow-press: var(--puff-in); --key-press: scale(.97);
    --card-border: none; --card-shadow: var(--puff);
    --r-card: 30px; --r-btn: 22px;
    --prog-empty: #f3d9ca; --prog-half: #d8cbff; --prog-full: #43c78b;
    --font-display: "Baloo 2", "Segoe UI", system-ui, sans-serif; --display-weight: 800;
    --font-num: var(--font-display); --num-weight: var(--display-weight);
    --font-body: "Baloo 2", "Segoe UI", system-ui, sans-serif;
    --trophy-ink: #fff;
  }

  /* ---------- Grundlayout ---------- */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-body); color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; align-items: center;
    overflow-x: hidden; user-select: none;
  }
  button { font-family: inherit; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .bubbles { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  body[data-look="arcade"] .bubbles { display: block; }
  .bubbles span {
    position: absolute; bottom: -80px; border-radius: 50%;
    background: rgba(62,224,255,.06);
    animation: rise linear infinite;
  }
  @keyframes rise { to { transform: translateY(-120vh); } }

  main { position: relative; z-index: 1; width: 100%; max-width: 720px; padding: 16px; }
  .screen { display: none; }
  .screen.active { display: block; animation: pop .3s ease-out; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  h1 {
    text-align: center; font-family: var(--font-display); font-weight: var(--display-weight); font-style: var(--display-style, normal);
    font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1.05; margin: 16px 0 6px; color: var(--text);
  }
  body[data-look="arcade"] h1 { text-transform: uppercase; letter-spacing: .04em; text-shadow: 0 0 24px rgba(62,224,255,.45); }
  body[data-look="comic"] h1 { color: #fffdf4; letter-spacing: .05em; -webkit-text-stroke: 2px #141414; text-shadow: 4px 4px 0 #141414; }
  .sub { text-align: center; color: var(--text-dim); font-size: 1.15rem; font-weight: 700; margin: 0 0 22px; }

  /* ---------- Auswahl ---------- */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  @media (max-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .tile {
    position: relative; aspect-ratio: 1; cursor: pointer;
    border: var(--key-border); border-radius: var(--r-btn);
    background: var(--key); color: var(--key-ink); box-shadow: var(--key-shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform .12s;
  }
  .tile:hover { transform: translateY(-3px); }
  .tile:active { transform: var(--key-press); box-shadow: var(--key-shadow-press); }
  .tile .num { font-family: var(--font-num); font-weight: var(--num-weight); font-style: var(--display-style, normal); font-size: clamp(1.8rem, 7vw, 2.4rem); line-height: 1; }
  .tile .medal {
    position: absolute; top: -9px; right: -9px; min-width: 30px; height: 30px; padding: 0 7px;
    border-radius: 999px; background: var(--alt); color: #fff; font-weight: 800; font-size: .85rem;
    display: flex; align-items: center; justify-content: center;
  }
  body[data-look="klar"] .tile.done { background: #16264a; border-color: #16264a; color: #fff; box-shadow: 0 4px 0 #0a1530; }
  body[data-look="klar"] .tile .medal { background: var(--accent); }
  body[data-look="arcade"] .tile { box-shadow: var(--key-shadow), inset 0 0 0 2px #2c3478; }
  body[data-look="arcade"] .tile.done { box-shadow: var(--key-shadow), inset 0 0 0 2px var(--accent); }
  body[data-look="arcade"] .tile::before { content: "LEVEL"; font-size: .62rem; font-weight: 700; letter-spacing: .14em; color: var(--muted); }
  body[data-look="arcade"] .tile .er { display: none; }
  body[data-look="arcade"] .tile .medal { background: #ffb627; color: #0d1030; }
  body[data-look="comic"] .tile:nth-child(3n+2) { background: #bfe3ff; }
  body[data-look="comic"] .tile:nth-child(3n) { background: #ffc2c7; }
  body[data-look="comic"] .tile .medal { border: 2px solid #141414; }

  .foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px 22px; margin-top: 30px; }
  .looks { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
  .looks-label { font-weight: 800; color: var(--text-dim); }
  .look {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    border: var(--key-border); border-radius: var(--r-btn); background: var(--key); color: var(--key-ink);
    box-shadow: var(--key-shadow); padding: 7px 12px 7px 8px; font-weight: 800; font-size: .95rem;
  }
  .look:active { transform: var(--key-press); box-shadow: var(--key-shadow-press); }
  .look[aria-checked="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
  .look .sw { width: 22px; height: 22px; border-radius: 6px; flex: none; }
  .sw-arcade { background: linear-gradient(135deg, #12163a 50%, #3ee0ff 50%); }
  .sw-klar   { background: linear-gradient(135deg, #16264a 50%, #ff6a13 50%); }
  .sw-comic  { background: linear-gradient(135deg, #ffd23f 50%, #e63946 50%); box-shadow: inset 0 0 0 2px #141414; }
  .sw-glas   { background: linear-gradient(135deg, #8fe3dc, #bcd7ff 55%, #ffc2cf); }
  .sw-sport  { background: linear-gradient(135deg, #1340d8 50%, #ffd400 50%); }
  .sw-knete  { background: linear-gradient(135deg, #d8cbff 50%, #b6f0d6 50%); }

  /* ---------- Üben ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .btn-small {
    border: var(--key-border); border-radius: var(--r-btn); background: var(--key); color: var(--key-ink);
    box-shadow: var(--key-shadow); font-size: 1rem; font-weight: 800; padding: 9px 14px; cursor: pointer;
  }
  .btn-small:active { transform: var(--key-press); box-shadow: var(--key-shadow-press); }
  .badge { font-family: var(--font-display); font-weight: var(--display-weight); font-style: var(--display-style, normal); font-size: 1.4rem; color: var(--text); text-align: center; }
  body[data-look="arcade"] .badge { text-transform: uppercase; letter-spacing: .06em; }
  body[data-look="comic"] .badge { font-size: 1.8rem; letter-spacing: .04em; color: #fffdf4; -webkit-text-stroke: 1.5px #141414; text-shadow: 3px 3px 0 #141414; }

  .progress { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-bottom: 8px; }
  .dot { height: 12px; border-radius: 999px; background: var(--prog-empty); transition: background .3s; }
  .dot.half { background: var(--prog-half); }
  .dot.full { background: var(--prog-full); }
  .dot.bump { animation: bump .5s; }
  @keyframes bump { 50% { transform: scale(1.3); } }
  body[data-look="arcade"] .dot { border-radius: 3px; }
  body[data-look="arcade"] .dot.full { box-shadow: 0 0 8px var(--accent); }
  body[data-look="comic"] .dot {
    height: auto; background: none; border-radius: 0; text-align: center; line-height: 1;
    font-size: clamp(1.2rem, 5vw, 1.7rem); color: var(--prog-empty);
  }
  body[data-look="comic"] .dot::before { content: "★"; }
  body[data-look="comic"] .dot.half { color: var(--prog-half); -webkit-text-stroke: 1.5px #141414; }
  body[data-look="comic"] .dot.full { color: var(--prog-full); -webkit-text-stroke: 1.5px #141414; }

  .round { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; font-weight: 700; color: var(--text-dim); margin-bottom: 14px; font-variant-numeric: tabular-nums; }

  .card {
    background: var(--surface); color: var(--ink); text-align: center; padding: 20px 18px;
    border: var(--card-border); border-radius: var(--r-card); box-shadow: var(--card-shadow);
  }
  .speech { display: inline-block; min-height: 1.5em; font-weight: 800; font-size: 1.05rem; color: var(--muted); }
  .speech.pop { animation: pop2 .4s; }
  @keyframes pop2 { 40% { transform: scale(1.12); } }
  body[data-look="arcade"] .speech { color: var(--accent); text-transform: uppercase; letter-spacing: .1em; font-size: .9rem; }
  body[data-look="comic"] .speech {
    position: relative; font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; letter-spacing: .04em; color: #141414;
    background: #fff; border: 3px solid #141414; border-radius: 18px; padding: 2px 16px; margin-bottom: 6px;
  }
  body[data-look="comic"] .speech::after {
    content: ""; position: absolute; left: 24px; bottom: -11px; width: 14px; height: 14px; background: #fff;
    border-right: 3px solid #141414; border-bottom: 3px solid #141414; transform: rotate(45deg) skew(10deg, 10deg);
  }

  .task {
    font-family: var(--font-num); font-weight: var(--num-weight); font-style: var(--display-style, normal); font-variant-numeric: tabular-nums;
    font-size: clamp(2.8rem, 13vw, 4.6rem); line-height: 1.15; margin: 10px 0 4px;
  }
  .task .x { color: var(--op); }
  .answer {
    display: inline-block; min-width: 1.8em; padding: 0 .15em; border-bottom: 5px solid var(--ans-line);
    color: var(--ans); transition: color .2s, border-color .2s;
  }
  .answer.good { color: var(--good); border-color: var(--good); }
  .answer.bad { color: var(--bad); border-color: var(--bad); animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .solution { min-height: 1.9rem; font-size: 1.3rem; font-weight: 800; color: var(--bad); }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .key, .choice {
    border: var(--key-border); border-radius: var(--r-btn); cursor: pointer;
    background: var(--key); color: var(--key-ink); box-shadow: var(--key-shadow);
    font-family: var(--font-num); font-weight: var(--num-weight); font-style: var(--display-style, normal); font-variant-numeric: tabular-nums;
    transition: background .2s, color .2s;
  }
  .key { font-size: clamp(1.6rem, 7vw, 2.1rem); padding: 12px 0; }
  .key:active, .choice:active { transform: var(--key-press); box-shadow: var(--key-shadow-press); }
  .key.del { color: var(--bad); }
  .key.ok { background: var(--good); color: #fff; box-shadow: var(--good-shadow); }
  .pad[hidden], .choices[hidden] { display: none; }

  /* Multiple Choice */
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
  .choice { font-size: clamp(2rem, 9vw, 2.8rem); padding: 20px 0; }
  .choice.good { background: var(--good); color: #fff; box-shadow: var(--good-shadow); }
  .choice.bad  { background: var(--bad); color: #fff; box-shadow: var(--bad-shadow); animation: shake .4s; }

  /* ---------- Geschafft ---------- */
  .trophy {
    width: 112px; height: 112px; margin: 4px auto 8px; border-radius: 50%; line-height: 1;
    display: flex; align-items: center; justify-content: center; font-size: 4rem;
    background: var(--prog-full); color: var(--trophy-ink, var(--surface)); border: var(--key-border); box-shadow: var(--key-shadow);
    animation: spin 1.2s ease-out;
  }
  @keyframes spin { from { transform: scale(0) rotate(-360deg); } to { transform: scale(1) rotate(0); } }
  .done-title { font-family: var(--font-display); font-weight: var(--display-weight); font-style: var(--display-style, normal); font-size: clamp(2rem, 8vw, 2.8rem); line-height: 1.1; margin: 6px 0; }
  body[data-look="comic"] .done-title { letter-spacing: .04em; }
  .stats { font-size: 1.15rem; font-weight: 700; color: var(--muted); margin: 8px 0 18px; }
  .stats .stars { color: var(--prog-full); letter-spacing: 2px; }
  .big-btn {
    display: block; width: 100%; cursor: pointer; margin-top: 14px; padding: 16px;
    border: var(--key-border); border-radius: var(--r-btn);
    font-family: var(--font-display); font-weight: var(--display-weight); font-style: var(--display-style, normal); font-size: 1.45rem;
    background: var(--accent); color: var(--accent-ink); box-shadow: var(--accent-shadow);
  }
  body[data-look="comic"] .big-btn { letter-spacing: .05em; }
  .big-btn.alt { background: var(--alt); color: #fff; box-shadow: var(--alt-shadow); }
  .big-btn:active { transform: var(--key-press); box-shadow: var(--key-shadow-press); }

  /* ---------- Glas: Milchglas-Flächen ---------- */
  body[data-look="glas"] :is(.card, .tile, .btn-small, .look, .key, .choice) { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  body[data-look="glas"] :is(.btn-small, .look) { border-radius: 999px; }
  body[data-look="glas"] .tile.done { background: rgba(14,159,154,.16); border-color: rgba(14,159,154,.5); }
  body[data-look="glas"] .tile .medal { background: var(--accent); }
  body[data-look="glas"] .dot { height: 8px; }
  body[data-look="glas"] .answer { border-bottom: none; background: rgba(255,255,255,.7); border-radius: 14px; }

  /* ---------- Sport: schräge Flächen (Hintergrund als geneigtes ::before, Text bleibt gerade) ---------- */
  body[data-look="sport"] :is(h1, .badge, .big-btn, .btn-small, .round, .look) { text-transform: uppercase; letter-spacing: .03em; }
  body[data-look="sport"] .round { font-size: 1rem; }
  body[data-look="sport"] :is(.key, .choice, .tile, .btn-small, .big-btn, .look) {
    position: relative; isolation: isolate; background: transparent; border: none; box-shadow: none;
    --sk-bg: var(--key); --sk-shadow: var(--key-shadow);
  }
  body[data-look="sport"] :is(.key, .choice, .tile, .btn-small, .big-btn, .look)::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 3px;
    background: var(--sk-bg); box-shadow: var(--sk-shadow); transform: skewX(-10deg);
  }
  body[data-look="sport"] :is(.key, .choice, .tile, .btn-small, .big-btn, .look):active { box-shadow: none; }
  body[data-look="sport"] :is(.key, .choice, .tile, .btn-small, .big-btn, .look):active::before { box-shadow: var(--key-shadow-press); }
  body[data-look="sport"] :is(.tile, .btn-small, .look) { --sk-bg: #fff; color: #0a1440; }
  body[data-look="sport"] .tile.done { --sk-bg: #ffd400; }
  body[data-look="sport"] .tile .medal { background: var(--alt); }
  body[data-look="sport"] .key.del { color: #ffd400; }
  body[data-look="sport"] :is(.key.ok, .choice.good) { --sk-bg: var(--good); }
  body[data-look="sport"] .choice.bad { --sk-bg: var(--bad); }
  body[data-look="sport"] .big-btn { --sk-bg: var(--accent); }
  body[data-look="sport"] .big-btn.alt { --sk-bg: var(--alt); }
  body[data-look="sport"] .dot { border-radius: 0; transform: skewX(-20deg); }
  body[data-look="sport"] .speech { color: #1340d8; text-transform: uppercase; letter-spacing: .05em; font-style: italic; font-size: 1.2rem; }

  /* ---------- Knete: weiche 3D-Knöpfe in Pastell ---------- */
  body[data-look="knete"] .progress { grid-template-columns: repeat(10, minmax(0, 30px)); justify-content: center; gap: 8px; }
  body[data-look="knete"] .dot { height: auto; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 2px 3px 5px rgba(61,44,78,.12); }
  body[data-look="knete"] :is(.dot.half, .dot.full) { box-shadow: var(--puff); }
  body[data-look="knete"] .answer { border-bottom: none; background: #fbe1d3; border-radius: 18px; box-shadow: var(--puff-in); }
  body[data-look="knete"] .choice:nth-child(1) { background: #b6f0d6; }
  body[data-look="knete"] .choice:nth-child(2) { background: #d8cbff; }
  body[data-look="knete"] .choice:nth-child(3) { background: #c2e2ff; }
  body[data-look="knete"] .choice.good { background: var(--good); color: #fff; }
  body[data-look="knete"] .choice.bad { background: var(--bad); color: #fff; }
  body[data-look="knete"] .tile:nth-child(4n+1) { background: #b6f0d6; }
  body[data-look="knete"] .tile:nth-child(4n+2) { background: #d8cbff; }
  body[data-look="knete"] .tile:nth-child(4n+3) { background: #c2e2ff; }
  body[data-look="knete"] .tile:nth-child(4n)   { background: #ffd0b5; }
  body[data-look="knete"] .tile .medal { background: var(--alt); }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body data-look="klar">
<div class="bubbles" id="bubbles"></div>
<canvas id="confetti"></canvas>

<main>
  <!-- Auswahl -->
  <section class="screen active" id="screen-select">
    <h1>Reihentrainer</h1>
    <p class="sub">Welche Reihe willst du heute üben?</p>
    <div class="grid" id="grid"></div>
    <div class="foot">
      <div class="looks" role="radiogroup" aria-label="Stil">
        <span class="looks-label">Stil:</span>
        <button class="look" role="radio" data-look="arcade"><span class="sw sw-arcade"></span>Level</button>
        <button class="look" role="radio" data-look="klar"><span class="sw sw-klar"></span>Klar</button>
        <button class="look" role="radio" data-look="comic"><span class="sw sw-comic"></span>Comic</button>
        <button class="look" role="radio" data-look="glas"><span class="sw sw-glas"></span>Glas</button>
        <button class="look" role="radio" data-look="sport"><span class="sw sw-sport"></span>Sport</button>
        <button class="look" role="radio" data-look="knete"><span class="sw sw-knete"></span>Knete</button>
      </div>
      <button class="btn-small" id="btn-reset">Sterne zurücksetzen</button>
    </div>
  </section>

  <!-- Üben -->
  <section class="screen" id="screen-play">
    <div class="topbar">
      <button class="btn-small" id="btn-back">‹ Zurück</button>
      <span class="badge" id="play-title"></span>
      <button class="btn-small" id="btn-sound"></button>
    </div>
    <div class="progress" id="progress"></div>
    <div class="round" id="round"></div>
    <div class="card">
      <span class="speech" id="speech">Los geht's!</span>
      <div class="task" id="task"></div>
      <div class="solution" id="solution"></div>
      <div class="pad" id="pad"></div>
      <div class="choices" id="choices" hidden></div>
    </div>
  </section>

  <!-- Geschafft -->
  <section class="screen" id="screen-done">
    <div class="card">
      <div class="trophy">★</div>
      <div class="done-title" id="done-title"></div>
      <div class="stats" id="done-stats"></div>
      <button class="big-btn" id="btn-again">Nochmal üben</button>
      <button class="big-btn alt" id="btn-other">Andere Reihe</button>
    </div>
  </section>
</main>

<script>
(() => {
  const NEEDED = 2;           // wie oft jede Aufgabe richtig sein muss
  const TIME_LIMIT = 10000;   // ms – unsichtbarer Timer
  const CONFETTI = {
    arcade: ["#3ee0ff", "#ffb627", "#ff4f8b", "#1fbf75", "#eef0ff"],
    klar:   ["#ff6a13", "#16264a", "#16a864", "#ffc49e", "#6a7591"],
    comic:  ["#e63946", "#2b59c3", "#ffd23f", "#2bb673", "#141414"],
    glas:   ["#0e9f9a", "#f25c78", "#8fe3dc", "#bcd7ff", "#ffc2cf"],
    sport:  ["#ffd400", "#ff5a4e", "#ffffff", "#16c47f", "#0a1440"],
    knete:  ["#b6f0d6", "#d8cbff", "#c2e2ff", "#ffd0b5", "#43c78b", "#ff8a5c"]
  };
  const PRAISE = ["Super!","Klasse!","Richtig!","Gut gemacht!","Spitze!","Genau!","Prima!","Stark!","Jawoll!","Sauber!"];
  const STREAK = { 3: "3 richtig in Folge!", 5: "5 in Folge! Stark!", 10: "10 in Folge! Du bist ein Profi!" };

  const $ = id => document.getElementById(id);
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];

  // ---------- Speicher (erfolgreich geschaffte Reihen, Ton, Stil) ----------
  const load = () => { try { return JSON.parse(sessionStorage.getItem("reihentrainer") || "{}"); } catch { return {}; } };
  const save = d => { try { sessionStorage.setItem("reihentrainer", JSON.stringify(d)); } catch {} };
  let store = load();
  if (!store.done) store.done = {};
  let soundOn = store.sound !== false;
  let look = CONFETTI[store.look] ? store.look : "klar";

  // ---------- Stil ----------
  function applyLook() {
    document.body.dataset.look = look;
    document.querySelectorAll(".look").forEach(b => b.setAttribute("aria-checked", b.dataset.look === look));
  }
  document.querySelectorAll(".look").forEach(b => b.addEventListener("click", () => {
    look = b.dataset.look; store.look = look; save(store); applyLook(); sndTap();
  }));
  const reiheName = r => look === "arcade" ? `Level ${r}` : `${r}er-Reihe`;

  // ---------- Hintergrund-Blasen (nur Level-Stil) ----------
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span");
    const size = 20 + Math.random() * 70;
    Object.assign(s.style, {
      width: size + "px", height: size + "px", left: Math.random() * 100 + "%",
      animationDuration: 12 + Math.random() * 18 + "s", animationDelay: -Math.random() * 30 + "s"
    });
    $("bubbles").appendChild(s);
  }

  // ---------- Töne ----------
  let ac;
  function tone(freq, start, dur, type = "sine", vol = .18) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type; o.frequency.value = freq;
      const t = ac.currentTime + start;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + dur);
    } catch {}
  }
  const sndGood = () => { tone(660, 0, .15); tone(880, .1, .25); };
  const sndBad  = () => { tone(220, 0, .3, "triangle"); };
  const sndWin  = () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .13, .3, "square", .08));
  const sndTap  = () => tone(440, 0, .05, "sine", .05);

  // ---------- Bildschirme ----------
  function show(name) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    $("screen-" + name).classList.add("active");
  }

  // ---------- Auswahl ----------
  function buildGrid() {
    const g = $("grid"); g.innerHTML = "";
    $("btn-reset").hidden = Object.keys(store.done).length === 0;
    for (let r = 1; r <= 10; r++) {
      const n = store.done[r];
      const b = document.createElement("button");
      b.className = "tile" + (n ? " done" : "");
      b.setAttribute("aria-label", `${r}er-Reihe`);
      b.innerHTML = `<span class="num">${r}<span class="er">er</span></span>` +
        (n ? `<span class="medal">★${n > 1 ? n : ""}</span>` : "");
      b.onclick = () => { sndTap(); startGame(r); };
      g.appendChild(b);
    }
  }

  // ---------- Spiel ----------
  let game = null;
  let nextTimer = null;   // ausstehender Wechsel zur nächsten Aufgabe
  const stopTimer = () => { clearTimeout(nextTimer); nextTimer = null; };

  function startGame(r) {
    stopTimer();
    game = {
      reihe: r,
      tasks: Array.from({ length: 10 }, (_, i) => ({ a: i + 1, count: 0 })),
      current: null, last: null, started: 0, round: 0,
      input: "", locked: false, streak: 0, attempts: 0, mistakes: 0
    };
    $("play-title").textContent = reiheName(r);
    say("Los geht's!");
    buildProgress();
    show("play");
    nextTask();
  }

  function say(text) {
    const s = $("speech");
    s.textContent = text;
    s.classList.remove("pop"); void s.offsetWidth; s.classList.add("pop");
  }

  function buildProgress() {
    const p = $("progress"); p.innerHTML = "";
    game.tasks.forEach((t, i) => {
      const d = document.createElement("div");
      d.className = "dot"; d.id = "dot" + i;
      p.appendChild(d);
    });
  }

  function updateDot(i, bump) {
    const t = game.tasks[i], d = $("dot" + i);
    d.className = "dot" + (t.count >= NEEDED ? " full" : t.count > 0 ? " half" : "");
    if (bump) { void d.offsetWidth; d.classList.add("bump"); }
  }

  function updateRound() {
    const need = game.round === 1 ? 1 : NEEDED;
    const done = game.tasks.filter(t => t.count >= need).length;
    $("round").innerHTML =
      `<span>${game.round === 1 ? "Runde 1 · Antippen" : "Runde 2 · Eintippen"}</span><span>${done} / ${game.tasks.length}</span>`;
  }

  function nextTask() {
    // Erst alle Multiple-Choice-Aufgaben (count 0), danach die Eingabe-Runde
    const mcOpen = game.tasks.filter(t => t.count === 0);
    const open = mcOpen.length ? mcOpen : game.tasks.filter(t => t.count < NEEDED);
    if (open.length === 0) return finish();
    const round = mcOpen.length ? 1 : 2;
    if (round !== game.round) {
      if (game.round) say("Runde 2: Jetzt selbst eintippen!");
      game.round = round;
    }
    updateRound();
    // gleiche Aufgabe nicht direkt hintereinander (wenn möglich)
    const pool = open.length > 1 ? open.filter(t => t !== game.last) : open;
    game.current = rand(pool);
    game.input = "";
    game.locked = false;
    // Erste Runde einer Aufgabe: Multiple Choice, danach selbst eintippen
    game.mc = game.current.count === 0;
    $("solution").textContent = "";
    $("pad").hidden = game.mc;
    $("choices").hidden = !game.mc;
    if (game.mc) buildChoices();
    renderTask();
    game.started = performance.now();
  }

  // Zwei falsche Antworten nah an der Lösung: Nachbarn in der Reihe (±r) und knapp daneben (±1, ±2)
  function buildChoices() {
    const sol = game.current.a * game.reihe, r = game.reihe;
    const near = [...new Set([sol - r, sol + r, sol - 1, sol + 1, sol - 2, sol + 2])]
      .filter(v => v > 0 && v !== sol)
      .sort(() => Math.random() - .5);
    const opts = [sol, near[0], near[1]].sort(() => Math.random() - .5);
    const c = $("choices"); c.innerHTML = "";
    opts.forEach(v => {
      const b = document.createElement("button");
      b.className = "choice"; b.textContent = v; b.dataset.v = v;
      b.addEventListener("click", () => pick(v));
      c.appendChild(b);
    });
  }

  function pick(v) {
    if (!game || game.locked) return;
    game.input = String(v);
    submit();
  }

  function markChoices(sol) {
    document.querySelectorAll("#choices .choice").forEach(b => {
      const v = Number(b.dataset.v);
      if (v === sol) b.classList.add("good");
      else if (String(v) === game.input) b.classList.add("bad");
    });
  }

  function renderTask(state = "") {
    const t = game.current;
    const ans = game.input === "" ? "?" : game.input;
    $("task").innerHTML =
      `${t.a} <span class="x">·</span> ${game.reihe} = <span class="answer ${state}">${ans}</span>`;
  }

  function press(k) {
    if (!game || game.locked || game.mc) return;
    if (k === "del") game.input = game.input.slice(0, -1);
    else if (k === "ok") return submit();
    else if (game.input.length < 3) game.input = (game.input === "0" ? "" : game.input) + k;
    sndTap();
    renderTask();
  }

  function submit() {
    if (game.input === "") return;
    game.locked = true;
    game.attempts++;
    const t = game.current;
    const elapsed = performance.now() - game.started;
    const correct = Number(game.input) === t.a * game.reihe;
    const idx = game.tasks.indexOf(t);
    game.last = t;
    if (game.mc) markChoices(t.a * game.reihe);

    if (correct) {
      // Nur innerhalb des Zeitlimits zählt es – zu langsam kommt stillschweigend wieder.
      const counted = elapsed <= TIME_LIMIT;
      if (counted) { t.count++; updateDot(idx, true); updateRound(); }
      game.streak++;
      renderTask("good");
      say(STREAK[game.streak] || rand(PRAISE));
      sndGood();
      if (game.streak === 5 || game.streak === 10) burst(60);
      nextTimer = setTimeout(nextTask, 800);
    } else {
      game.streak = 0;
      game.mistakes++;
      renderTask("bad");
      $("solution").textContent = `${t.a} · ${game.reihe} = ${t.a * game.reihe}`;
      say("Fast! Merk dir die Lösung, die Aufgabe kommt wieder.");
      sndBad();
      nextTimer = setTimeout(nextTask, 5000);
    }
  }

  function finish() {
    const r = game.reihe;
    store.done[r] = (store.done[r] || 0) + 1;
    save(store);
    $("done-title").textContent = `${reiheName(r)} geschafft!`;
    const m = game.mistakes;
    $("done-stats").innerHTML =
      `${game.attempts} Antworten · ${m === 0 ? "kein einziger Fehler!" : m + " Fehler"}<br>` +
      `Schon ${store.done[r]}× geschafft <span class="stars">${"★".repeat(Math.min(store.done[r], 10))}</span>`;
    show("done");
    sndWin();
    burst(250);
  }

  // ---------- Zahlenfeld ----------
  const pad = $("pad");
  ["1","2","3","4","5","6","7","8","9","del","0","ok"].forEach(k => {
    const b = document.createElement("button");
    b.className = "key" + (k === "del" ? " del" : k === "ok" ? " ok" : "");
    b.textContent = k === "del" ? "⌫" : k === "ok" ? "✔" : k;
    b.addEventListener("click", () => press(k));
    pad.appendChild(b);
  });

  document.addEventListener("keydown", e => {
    if (!$("screen-play").classList.contains("active")) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); press("del"); }
    else if (e.key === "Enter") { e.preventDefault(); press("ok"); }
  });

  $("btn-back").onclick = () => { stopTimer(); game = null; buildGrid(); show("select"); };
  $("btn-again").onclick = () => startGame(game.reihe);
  $("btn-other").onclick = () => { buildGrid(); show("select"); };
  $("btn-reset").onclick = () => {
    if (!confirm("Wirklich alle Sterne löschen?")) return;
    store.done = {}; save(store); buildGrid();
  };
  const updSound = () => $("btn-sound").textContent = soundOn ? "Ton an" : "Ton aus";
  $("btn-sound").onclick = () => { soundOn = !soundOn; store.sound = soundOn; save(store); updSound(); };
  updSound();

  // ---------- Konfetti ----------
  const cv = $("confetti"), cx = cv.getContext("2d");
  let parts = [], running = false;
  const resize = () => { cv.width = innerWidth; cv.height = innerHeight; };
  addEventListener("resize", resize); resize();

  function burst(n) {
    for (let i = 0; i < n; i++) {
      parts.push({
        x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .4,
        y: innerHeight * .35,
        vx: (Math.random() - .5) * 16, vy: -Math.random() * 16 - 4,
        s: 6 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
        c: rand(CONFETTI[look]), life: 0
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  function tick() {
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < cv.height + 40 && p.life < 400);
    for (const p of parts) {
      p.vy += .4; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
      cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      cx.restore();
    }
    if (parts.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
  }

  applyLook();
  buildGrid();
})();
</script>
</body>
</html>
